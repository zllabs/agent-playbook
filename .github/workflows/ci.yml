name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API deps
        run: |
          cd apps/api
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Skill package tests
        run: python -m tests

      - name: API smoke tests
        run: cd apps/api && .venv/bin/python test_recommend.py

      - name: Recommend quality eval
        run: cd apps/api && .venv/bin/python test_recommend_eval.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Web build
        run: |
          cd apps/web
          npm ci
          npm run build
